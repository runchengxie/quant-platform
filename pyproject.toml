[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.0.1"
description = "Public reusable quant research and portfolio platform"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "numpy>=1.23",
  "pandas>=2.0",
  "pyarrow>=25.0.1",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "research-contracts>=0.1.0",
]

[project.scripts]
strategy-pipeline = "strategy_pipeline.cli:main"

[project.optional-dependencies]
engine = ["quant-backtest-engine-client @ git+https://github.com/runchengxie/quant-backtest-engine.git@f0ba2ef193c721c7bd497c4d80a7bc8a01c18a31#subdirectory=python"]
ml = [
  "pandas-ta>=0.3.14b0",
  "scikit-learn>=1.9.0",
  "ta>=0.11,<0.12",
  "xgboost>=1.7",
]
dev = [
  "pandas-ta>=0.3.14b0",
  "scikit-learn>=1.9.0",
  "xgboost>=1.7",
  "jsonschema>=4.25",
  "pytest>=9.0.3",
  "research-code-quality",
  "ruff>=0.8",
  "ty==0.0.77",
]
qlib = ["pyqlib>=0.9.5"]
microstructure = ["polars>=1.0", "torch>=2.0", "scikit-learn>=1.9.0"]

[dependency-groups]
test = ["pytest>=9.0.3"]
dev = [
  "quant-backtest-engine-client @ git+https://github.com/runchengxie/quant-backtest-engine.git@f0ba2ef193c721c7bd497c4d80a7bc8a01c18a31#subdirectory=python",
  "maturin>=1,<2",
  "pandas-ta>=0.3.14b0",
  "scikit-learn>=1.9.0",
  "xgboost>=1.7",
  "polars>=1.0",
  "torch>=2.0",
  "jsonschema>=4.25",
  "pytest>=9.0.3",
  "pytest-cov>=6.0",
  "research-code-quality",
  "ruff>=0.8",
  "ty==0.0.77",
  "ta>=0.11,<0.12",
]
docs = [
  "mkdocs-material>=9.6,<10",
]

[tool.setuptools]
packages = [
  "alpha_research",
  "alpha_research.backends",
  "alpha_research.contextual",
  "alpha_research.style_factors",
  "alpha_research.style_factors.helpers",
  "alpha_research.style_replica",
  "alpha_research.technical",
  "portfolio_backtester",
  "portfolio_backtester.backends",
  "portfolio_backtester.execution_sim",
  "quant_execution_engine",
  "quant_execution_engine.broker",
  "quant_execution_engine.renderers",
  "quant_platform",
  "quant_platform._portfolio",
  "quant_platform._portfolio.backends",
  "quant_platform._portfolio.execution_sim",
  "quant_platform.analytics",
  "quant_platform.backtest",
  "quant_platform.backtest.legacy",
  "quant_platform.backtest.legacy.backends",
  "quant_platform.backtest.legacy.execution_sim",
  "quant_platform.portfolio",
  "strategy_pipeline",
  "strategy_pipeline.control_plane",
  "ticknet",
  "ticknet.eventstream",
  "ticknet.simulator"
]
[tool.setuptools.package-dir]
portfolio_backtester = "packages/platform/src/portfolio_backtester"
quant_platform = "packages/platform/src/quant_platform"
alpha_research = "packages/alpha/src/alpha_research"
strategy_pipeline = "packages/orchestration/src/strategy_pipeline"
quant_execution_engine = "packages/execution/src/quant_execution_engine"
ticknet = "packages/microstructure/src/ticknet"

[tool.uv.sources]
research-code-quality = { git = "https://github.com/runchengxie/quant-code-quality.git", rev = "1c754c3" }
research-contracts = { path = "packages/research-contracts" }

[tool.uv]
override-dependencies = ["research-contracts>=0.1.0"]

[tool.pytest.ini_options]
pythonpath = [
  "packages/alpha/src",
  "packages/orchestration/src",
  "packages/execution/src",
  "packages/platform/src",
  ".",
]
markers = ["unit: fast deterministic unit tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]
allowed-confusables = ["，", "：", "；", "（", "）", "｜", "×"]

[tool.ruff.lint.isort]
known-first-party = ["quant_platform", "portfolio_backtester", "strategy_pipeline", "quant_execution_engine"]

[tool.ty.src]
include = ["packages/platform/src", "packages/orchestration/src", "packages/execution/src", "packages/alpha/src", "packages/microstructure/src", "scripts"]
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.ty.environment]
extra-paths = [
  "packages/platform/src",
  "packages/orchestration/src",
  "packages/execution/src",
  "packages/alpha/src",
  "packages/microstructure/src",
  "packages/microstructure/rust",
  "packages/research-contracts",
]

[[tool.ty.overrides]]
include = ["packages/platform/src/portfolio_backtester/backends/qlib.py"]
rules = { unresolved-import = "ignore" }

# Rich is optional here; plain-text rendering works without the dependency.
[[tool.ty.overrides]]
include = ["packages/execution/src/quant_execution_engine/renderers/diff.py"]
rules = { unresolved-import = "ignore" }

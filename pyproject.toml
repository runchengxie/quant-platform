[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.0.1"
description = "Local-only quant-platform migration prototype"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "pyarrow>=25.0.1",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "scikit-learn>=1.9.0",
  "xgboost>=1.7",
  "research-contracts>=0.1.0",
]

[project.scripts]
portfolio-style-factor = "portfolio_backtester.style_factor_cli:main"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25",
  "pytest>=9.0.3",
  "research-code-quality",
  "ruff>=0.8",
  "ty==0.0.77",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25",
  "pytest>=9.0.3",
  "research-code-quality",
  "ruff>=0.8",
  "ty==0.0.77",
]

[tool.setuptools]
package-dir = {"" = "packages/portfolio-backtester/src"}

[tool.setuptools.packages.find]
where = ["packages/portfolio-backtester/src"]
include = [
  "portfolio_backtester",
  "portfolio_backtester.*",
  "market_data_platform",
  "market_data_platform.*",
  "quant_platform",
  "quant_platform.*",
  "research_contracts",
  "research_contracts.*",
]

[tool.uv.sources]
research-code-quality = { git = "https://github.com/runchengxie/research-code-quality.git", rev = "1c754c3" }
research-contracts = { path = "packages/research-contracts" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "packages/research-contracts",
  "packages/portfolio-backtester/src/portfolio_backtester",
  "packages/portfolio-backtester/src/research_contracts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_backtester", "market_data_platform"]

[tool.ty.src]
include = ["packages/portfolio-backtester/src", "scripts"]
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[[tool.ty.overrides]]
include = ["packages/portfolio-backtester/src/portfolio_backtester/backends/qlib.py"]
rules = { unresolved-import = "ignore" }

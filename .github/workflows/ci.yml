name: public-ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups --extra dev --extra microstructure
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Typecheck migrated framework packages
        # Migrated legacy packages currently report advisory ty warnings; fail on errors.
        run: >-
          .venv/bin/ty check --exit-zero-on-warning
          packages/alpha/src packages/orchestration/src packages/execution/src
      - run: .venv/bin/pytest -q

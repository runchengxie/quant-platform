name: public-ci
on: [push, pull_request]
jobs:
  engine-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the released session protocol provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runchengxie/quant-backtest-engine
          ref: 19a2ae714b567fc1a46cf996fa5a86a90138bc44
          path: session-engine-provider
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build pinned provider
        run: cargo +1.99.1 build --locked --release --manifest-path session-engine-provider/Cargo.toml
      - run: uv sync --locked --no-default-groups --group test --extra engine --python 3.12
      - name: Exercise sizing and session replay against the real engine
        shell: bash
        run: |
          export SESSION_ENGINE_BINARY="$GITHUB_WORKSPACE/session-engine-provider/target/release/quant-backtest-engine"
          export SESSION_ENGINE_SHA256="$(sha256sum "$SESSION_ENGINE_BINARY" | cut -d ' ' -f 1)"
          test -x "$SESSION_ENGINE_BINARY"
          uv run --locked --no-default-groups --group test --extra engine pytest -q tests/test_engine_session_client.py tests/test_engine_ledger_comparison.py
  dependency-modes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked --no-default-groups --python ${{ matrix.python }}
      - name: Verify lean runtime dependencies
        run: .venv/bin/python scripts/check_minimal_install.py
      - name: Run backtests without machine learning packages
        run: >-
          uv run --locked --no-default-groups --group test pytest -q
          tests/test_backtest_backends.py tests/test_backtest_bundle.py
          tests/test_optimizer_backends.py tests/test_execution_sim.py
      - name: Install optional machine learning dependencies
        run: uv sync --locked --no-default-groups --extra ml
      - name: Test models and features with the ml extra
        run: >-
          uv run --locked --no-default-groups --extra ml --group test pytest -q
          tests/alpha/test_modeling.py tests/alpha/test_feature_engineering_short_series.py
  platform-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/platform-wheels"
      - run: uv venv --python 3.13 "$RUNNER_TEMP/platform-wheel-env"
      - name: Install regular base wheel outside project configuration
        working-directory: ${{ runner.temp }}
        run: >-
          uv pip install --python "$RUNNER_TEMP/platform-wheel-env/bin/python"
          "$GITHUB_WORKSPACE/packages/research-contracts"
          "$RUNNER_TEMP/platform-wheels/quant_platform-0.1.0-py3-none-any.whl"
      - name: Check base wheel with mandatory provider and without machine learning extras
        run: >-
          "$RUNNER_TEMP/platform-wheel-env/bin/python" -I scripts/check_platform_wheel.py
          --module-map docs/migration/portfolio-module-map.json
      - name: Verify compatibility engine extra
        working-directory: ${{ runner.temp }}
        run: >-
          uv pip install --python "$RUNNER_TEMP/platform-wheel-env/bin/python"
          "$RUNNER_TEMP/platform-wheels/quant_platform-0.1.0-py3-none-any.whl[engine]"
      - name: Check regular wheel with compatibility extra
        run: >-
          "$RUNNER_TEMP/platform-wheel-env/bin/python" -I scripts/check_platform_wheel.py
          --module-map docs/migration/portfolio-module-map.json --engine-enabled
  rust-microstructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Log Rust compiler version
        run: rustc --version
      - name: Install standalone microstructure extra
        run: uv sync --locked --no-default-groups --extra microstructure
      - name: Verify standalone training metrics
        run: >-
          .venv/bin/python -c "import numpy as np;
          from ticknet.train import f1_metrics;
          assert f1_metrics(np.array([0, 1, 1]), np.array([0, 1, 1]))['accuracy'] == 1.0"
      - run: uv sync --locked --all-groups --extra dev --extra microstructure
      - run: cargo fmt --check --manifest-path packages/microstructure/rust/Cargo.toml
      - run: cargo check --locked --manifest-path packages/microstructure/rust/Cargo.toml
      - run: uv run --locked maturin build --locked --release -m packages/microstructure/rust/Cargo.toml --out /tmp/microstructure-wheels
      - run: uv pip install --python .venv/bin/python /tmp/microstructure-wheels/*.whl
      - run: TICKNET_REQUIRE_RUST=1 .venv/bin/pytest tests/microstructure -q
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked --all-groups --extra dev --extra microstructure
      - run: uv run ruff check .
      - name: Keep production imports on public platform owners
        run: .venv/bin/python scripts/dev/check_legacy_imports.py
      - run: uv run ruff format --check .
      - name: Typecheck configured source surface
        run: .venv/bin/ty check --error-on-warning
      - run: .venv/bin/pytest -q
      - name: Audit public dependencies
        run: >-
          uvx --from pip-audit pip-audit --strict
          -r <(uv export --locked --all-groups --extra dev
          --extra microstructure --format requirements-txt --no-hashes
          --no-emit-project --no-emit-local
          --no-emit-package quant-platform
          --no-emit-package research-contracts
          --no-emit-package research-code-quality
          --no-emit-package quant-backtest-engine-client
          --no-emit-package quant-backtest-core)

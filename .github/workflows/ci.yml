name: public-ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff check .
      - name: Typecheck
        run: .venv/bin/ty check
      - run: .venv/bin/pytest -q

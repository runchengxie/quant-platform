site_name: quant-platform
site_description: Public reusable quant research and portfolio platform
site_url: https://runchengxie.github.io/quant-platform/
repo_name: runchengxie/quant-platform
repo_url: https://github.com/runchengxie/quant-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

exclude_docs: |
  internal/**
  alpha/internal/**
  superpowers/**
  alpha/superpowers/**
  **/*.json
  **/*.yml

nav:
  - 项目概览: README.md
  - 快速开始:
      - 常用入口: guides/entry-points.md
      - 袖套组合: guides/sleeve-portfolio.md
      - 执行模拟: guides/execution-simulation.md
      - 收盘诊断回放: guides/diagnostic-close-replay.md
      - 旧仓再资格: guides/incumbent-requalification.md
      - 旧仓再资格 OOS 控制: guides/incumbent-requalification-oos-controls.md
      - 晋升旁路: guides/promotion-sidecar.md
  - 核心概念:
      - 回测规范: concepts/backtest-spec.md
      - 回测配置: concepts/backtest-configuration.md
      - 后端架构: concepts/backend-architecture.md
      - 回测结果解读: concepts/backtest-interpretation.md
      - 标准回测包: concepts/canonical-backtest-bundle.md
      - 组合优化后端: concepts/portfolio-optimization-backends.md
      - 风格因子组合权重: concepts/style-factor-portfolio-weighting.md
      - AFML 仓位与风险: concepts/afml-sizing-and-risk.md
      - 因子归因: concepts/factor-attribution.md
      - 基准阶梯: concepts/benchmark-ladder.md
      - 换手率: concepts/turnover.md
      - 执行成本: concepts/execution-costs.md
      - 成本拆解: concepts/cost-breakdown.md

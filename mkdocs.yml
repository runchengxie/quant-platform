site_name: quant-platform
site_description: Public reusable quant research and portfolio platform
site_url: https://runchengxie.github.io/quant-platform/
repo_name: runchengxie/quant-platform
repo_url: https://github.com/runchengxie/quant-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/locale_navigation.py

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

exclude_docs: |
  migration/legacy-materials/**
  internal/**
  alpha/internal/**
  superpowers/**
  alpha/superpowers/**
  accounting_execution_roadmap.md
  alpha/testing.md
  alpha/playbooks/research-template-design.md
  orchestration/cli-helpers.md
  orchestration/configuration.md
  orchestration/quality-gates.md
  orchestration/runtime-helpers.md
  **/*.json
  **/*.yml

